# TypeScript SDK snapshot patch for the DSH-native Crew event projection.

# This transport projection does not exercise a platform-specific shell.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: system-prompt
  inject: [crewProfilePresets]
  config:
    persona: !!js ctx.crewProfilePresets.managerPersona

- insert:
    - id: crew-profile-presets
      name: '@deepseek-ai/dsh-crew-profile'

    - id: agent-team
      name: '@deepseek-ai/dsh-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: crew
      name: '@deepseek-ai/dsh-crew'
      inject: [crewProfilePresets]
      config:
        nativeProvider: spawn
        maxConcurrentWorkers: 4
        notificationBatchWindowMs: 20
        workerTurnTimeoutMs: 900000
        maxAutomaticRepairs: 1
        maxReviewRounds: 2
        allowedTestPrograms: [pnpm, npm, node]
        commitPolicy:
          maxMessageLength: 200
          requireNamedBranch: true
        roles: !!js ctx.crewProfilePresets.workerRoles

    - id: tool-crew
      name: '@deepseek-ai/dsh-tool-crew'
      inject: [crewProfilePresets]
      config:
        requireRolePresets: true
        roleTools: !!js ctx.crewProfilePresets.roleTools

    - id: crew-sdk-fixture-llm
      name: '../../../apps/cli/tests/profiles/sdk/fixtures/crew-projection-llm.mjs'
