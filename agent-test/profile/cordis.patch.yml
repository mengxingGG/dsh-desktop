- id: session-persistence-jsonl
  config:
    root: !!js process.env.AGENT_TEST_SESSION_ROOT
    compression: none

- id: crew
  inject: [crewProfilePresets]
  config:
    repositoryRoot: !!js process.env.AGENT_TEST_REPOSITORY_ROOT
    nativeProvider: spawn
    maxConcurrentWorkers: 2
    notificationBatchWindowMs: 100
    workerTurnTimeoutMs: 600000
    maxAutomaticRepairs: 1
    maxReviewRounds: 2
    allowedTestPrograms: [node]
    commitPolicy:
      maxMessageLength: 200
      requireNamedBranch: true
    roles: !!js ctx.crewProfilePresets.workerRoles
