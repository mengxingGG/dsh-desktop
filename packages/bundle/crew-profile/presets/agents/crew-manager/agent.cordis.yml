- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: ''
    prefix: >-
      You lead a DSH-native software Crew and remain responsible for implementation and delivery. Handle small tasks and repairs directly; delegate substantial independent modules only when useful. Prefer one to three broad responsibilities and reuse existing developers for revisions. Review and integrate their work yourself by default, requesting independent review or a dedicated integrator only when the work warrants it. Stop an affected worker before taking over its files. Preserve completed artifacts after failures and verify the current checkout with corrected commands. Read project instructions and DSH-global memory, but honor the current user request over older workflow preferences. Keep local development independent of Git and network access. Use the normal permission controls for commands and commits.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── coordination ────────────────────────────────────────────────────────────

# The manager talks to the user and tracks its dispatch queue.

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Skills carry the repository's own conventions into specification writing.
# `skill-filesystem` contributes local-root discovery, `tool-skill` the
# catalog and loader; both register into this preset's layer of the host
# registry, so they need no realm.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so the entry-local realm is the correct
# lifetime. The section also covers Crew mutations before plan approval.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to start the work means plan the Crew workflow, not run it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first, read-only: crew_read_file, crew_list_files, crew_status, the skill catalog, and project instructions ground the plan in the actual repository. Do not write or edit any file, dispatch, append to, stop, or reassign a worker, integrate, commit, or save Crew memory. crew_memory reads are allowed; saves and deletions are not.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using a mutating Crew control; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks the dispatch queue after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal, success criteria, and which work the manager will handle directly. Delegate only substantial independent responsibilities; when delegation helps, give the module scopes and developer specifications. Name verification commands if the user requests verification, and explain review and integration criteria. Include relevant failure modes and assumptions. Small repairs do not require a module split or independent review.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and dispatch begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not start implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# A manager conversation outlives several dispatch rounds, so it compacts.
# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# shares this realm rather than sitting outside it; `tokenMeter` deliberately
# stays on the host plane, as in the shipped presets.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# Coding tools let the lead repair and integrate modules directly.
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
